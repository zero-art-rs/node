[workspace]
members = [
    "apps/zrt-node",
    "crates/api",
    "crates/proof-verifier",
    "crates/storage",
    "crates/types",
    "crates/callback", "crates/tests",
]
resolver = "2"

[profile.test]
inherits = "release"

[workspace.dependencies]
chrono = { version = "0.4.41", default-features = false }
rand = { version = "0.9.1", default-features = false }
base64 = { version = "0.22.1", default-features = false }
serde = { version = "1.0.219", default-features = false }
serde_json = { version = "1.0.140", default-features = false }
tracing = { version = "0.1.41", default-features = false }
tokio = { version = "1.45.1", default-features = false }
tokio-util = { version = "0.7.15", default-features = false }
eyre = { version = "0.6.12" }
tower = { version = "0.5.2", default-features = false }
tower-http = { version = "0.6.6", default-features = false }
async-trait = { version = "0.1.74", default-features = false }
futures-util = { version = "0.3.31", default-features = false }
hex = { version = "0.4.3", default-features = false }
hyper = { version = "1.6.0", default-features = false }
thiserror = { version = "2.0.12", default-features = false }
ark-std = { version = "0.5.0", default-features = false }
ark-ec = { version = "0.5.0", default-features = false, git = "https://github.com/arkworks-rs/algebra", rev = "7601bf9" }
ark-ff = { version = "0.5.0", git = "https://github.com/arkworks-rs/algebra", rev = "7601bf9" }
ark-ed25519 = { version = "0.5.0", git = "https://github.com/arkworks-rs/algebra", rev = "7601bf9" }
ark-serialize = { version = "0.5.0", default-features = false, git = "https://github.com/arkworks-rs/algebra", rev = "7601bf9" }
utoipa = { version = "5.3.1", features = ["axum_extras", "uuid", "chrono"] }
utoipa-swagger-ui = { version = "9.0.1", features = ["axum", "reqwest"] }
utoipa-axum = "0.2"
axum = { version = "0.8.1", features = ["macros"] }
validator = { version = "0.20.0", features = ["derive"] }
mongodb = { version = "3.2.3" }
bson = { version = "2.15.0", features = ["chrono-0_4"] }
tracing-subscriber = { version = "0.3.19", features = ["json", "fmt", "env-filter", "ansi"] }
uuid = { version = "1.17.0", features = ["v7", "serde"] }
jsonwebtoken = "9.3.1"
postcard = { version = "1.1.2"  }
serde_with = { version = "3.14.0", features = ["base64"] }
curve25519-dalek = { version = "4.1.3", features = ["digest", "group", "rand_core", "serde"] }
serde_urlencoded = { version = "0.7.1" }
axum-core = "0.5.2"
sha3 = "0.10.8"
axum-test = { version = "18.0.2" }
prost = "0.14.1"
prost-types = { version = "0.14.1" }
bytes = { version = "1.10.1" }
eventsource-stream = { version = "0.2.3" }
futures = { version = "0.3.31" }
reqwest = { version = "0.12.23" }
zkp = { version = "0.10.0", git = "https://github.com/juja256/zkp", features = ["rangeproof", "rangeproof_batchable"]}
zrt-zk = { git = "https://github.com/zero-art-rs/core.git", branch = "feature/zrt-art-refactor" }
zrt-art = { git = "https://github.com/zero-art-rs/core.git", branch = "feature/zrt-art-refactor" }
zrt-crypto = { git = "https://github.com/zero-art-rs/core.git", branch = "feature/zrt-art-refactor" }
cortado = { git = "https://github.com/zero-art-rs/core.git", branch = "feature/zrt-art-refactor" }
bulletproofs = { version = "5.0.0", git="https://github.com/zero-art-rs/bulletproofs", features=["yoloproofs"] }
zrt-client-sdk = { git = "https://github.com/zero-art-rs/client-sdk.git", branch = "feature/merge-core" }


[workspace.lints.rust]
unsafe_code = "warn"
missing_docs = "deny"

[workspace.metadata.clippy]
warn-on-all-levels = true
deny-warnings = true
