[workspace]
members = [ "apps/node", "crates/art", "crates/rpc-server"]
resolver = "2"

[workspace.dependencies]
chrono = { version = "0.4", default-features = false }
uuid = { version = "1.4", default-features = false }
aes-gcm = { version = "0.10", default-features = false }
rand = { version = "0.9.1", default-features = false }
base64 = { version = "0.22.1", default-features = false }
tonic = { version = "0.13.1", default-features = false }
ark-ec = {  version = "0.5.0", default-features = false }
ark-ff = { version = "0.5.0", default-features = false }
ark-std = { version = "0.5.0", default-features = false }
ark-serialize = { version = "0.5.0", default-features = false }
ark-bn254 = { version = "0.5.0", default-features = false }
serde = { version = "1.0.219", default-features = false }
serde_json = { version = "1.0.140", default-features = false }
criterion = { version = "0.6.0", default-features = false }
