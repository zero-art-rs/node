[package]
name = "art"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bench]]
name = "art_benches"
harness = false

[dependencies]
ark-ec = {  version = "0.5.0" }
ark-ff = "0.5.0"
ark-std = "0.5.0"
ark-serialize = { version = "0.5.0", features = ["derive"] }
ark-bn254 = "0.5.0"
#rand = { workspace = true }
rand = "0.8.0"
serde = { version = "1.0.219", features = ["derive", "rc"] }
serde_json = "1.0.140"
criterion = "0.6.0"